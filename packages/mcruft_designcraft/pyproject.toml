# this_file: packages/mcruft_designcraft/pyproject.toml
[project]
license = "Apache-2.0"
name = "mcruft-designcraft"
description = "IDML page-layout conversion and PDF/PNG export for mcruft"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = ["mcruft"]

[project.urls]
Documentation = "https://code.twardoch.com/mcruft/"
Source = "https://github.com/twardoch/mcruft"
Issues = "https://github.com/twardoch/mcruft/issues"

[project.optional-dependencies]
all = ["mcruft-designcraft[bundled]"]
bundled = ["mcruft-designcraft-bin"]

[project.entry-points."mcruft.engines"]
designcraft = "mcruft_designcraft:engine"

[tool.uv.sources]
mcruft = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = "../.."

[tool.hatch.build.hooks.vcs]
version-file = "src/mcruft_designcraft/__version__.py"

[tool.uv]
# Rebuild editable installs when git state changes, so hatch-vcs metadata stays current.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# this_file: packages/mcruft_pdfcraft/pyproject.toml
[project]
license = "Apache-2.0"
name = "mcruft-pdfcraft"
description = "PDF page rendering and extraction engines for mcruft"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = ["mcruft", "pypdf"]

[project.urls]
Documentation = "https://code.twardoch.com/mcruft/"
Source = "https://github.com/twardoch/mcruft"
Issues = "https://github.com/twardoch/mcruft/issues"

[project.optional-dependencies]
all = ["mcruft-pdfcraft[bundled,native]"]
native = ["mcruft-pdfcraft-native[all]"]
bundled = ["mcruft-pdfcraft-bin"]

[project.entry-points."mcruft.engines"]
pdfcraft = "mcruft_pdfcraft:engine"
pdfcraft_native = "mcruft_pdfcraft.native:engine"

[tool.uv.sources]
mcruft = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = "../.."

[tool.hatch.build.hooks.vcs]
version-file = "src/mcruft_pdfcraft/__version__.py"

[tool.uv]
# Rebuild editable installs when git state changes, so hatch-vcs metadata stays current.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# this_file: .github/workflows/docs.yml
name: Documentation
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: |
          uv venv .cache/docs
          uv pip install --python .cache/docs/bin/python -r src_docs/requirements.txt
          .cache/docs/bin/properdocs build --strict -f src_docs/mkdocs.yml
      - name: Commit generated docs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          touch docs/.nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs
          if ! git diff --cached --quiet; then
            git commit -m 'docs: build documentation [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: docs
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
